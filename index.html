<!DOCTYPE html>
<html>

<head>
  <title>Nintendo Switch Grid Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .game {
      background: #1a1a1a;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 0 0 transparent;
    }

    .game:hover {
      transform: scale(1.06);
      background: #222;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
    }

    .game img {
      width: 100%;
      border-radius: 10px;
    }

    .title {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 500;
    }

    #gameContainer {
      width: 100%;
      height: 70vh;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Nintendo Switch Grid</h1>

  <div class="grid">

    <div class="game" onclick="startGame('gb', 'pokemon_crystal.zip')">
      <img src="pokemon_crystal.jpg" alt="Pokémon Crystal">
      <div class="title">Pokémon Crystal (GB)</div>
    </div>

    <div class="game" onclick="startGame('gb', 'zelda_links_awakening.zip')">
      <img src="zelda_links_awakening.jpg" alt="Zelda Link's Awakening">
      <div class="title">Zelda: Link's Awakening (GB)</div>
    </div>

    <div class="game" onclick="startGame('gbc', 'zelda_oracle_of_ages.zip')">
      <img src="zelda_oracle_of_ages.jpg" alt="Zelda Oracle of Ages">
      <div class="title">Zelda: Oracle of Ages (GBC)</div>
    </div>

    <div class="game" onclick="startGame('gba', 'pokemon_ruby.zip')">
      <img src="pokemon_ruby.jpg" alt="Pokémon Ruby">
      <div class="title">Pokémon Ruby (GBA)</div>
    </div>

    <div class="game" onclick="startGame('gba', 'pokemon_emerald.zip')">
      <img src="pokemon_emerald.jpg" alt="Pokémon Emerald">
      <div class="title">Pokémon Emerald (GBA)</div>
    </div>

    <div class="game" onclick="startGame('nds', 'pokemon_black.nds')">
      <img src="pokemon_black.jpg" alt="Pokémon Black">
      <div class="title">Pokémon Black (NDS)</div>
    </div>

    <div class="game" onclick="startGame('nds', 'pokemon_white.nds')">
      <img src="pokemon_white.jpg" alt="Pokémon White">
      <div class="title">Pokémon White (NDS)</div>
    </div>

  </div>

  <div id="gameContainer"></div>

  <script>
    async function checkBios(system) {
      const biosFiles = {
        gba: ["bios/gba_bios.bin"],
        nds: [
          "bios/bios7.bin",
          "bios/bios9.bin",
          "bios/firmware.bin"
        ]
      };

      if (!biosFiles[system]) return true;

      for (const file of biosFiles[system]) {
        try {
          const response = await fetch(file, { method: "HEAD" });

          if (!response.ok) {
            alert(
              system.toUpperCase() +
              " BIOS is missing!\nExpected file:\n" +
              file
            );
            return false;
          }
        } catch (err) {
          alert(
            "Could not check BIOS file:\n" +
            file +
            "\nMake sure it exists in your /bios folder."
          );
          return false;
        }
      }

      return true;
    }

    async function startGame(system, rom) {
      const biosOK = await checkBios(system);
      if (!biosOK) return;

      document.getElementById("gameContainer").innerHTML = "";

      const coreMap = {
        gb: "gb",
        gbc: "gbc",
        gba: "gba",
        nds: "nds"
      };

      window.EJS_player = "#gameContainer";
      window.EJS_core = coreMap[system];
      window.EJS_gameUrl = `roms/${rom}`;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_touchscreen = true;
      window.EJS_startOnLoaded = true;

      if (system === "gba") {
        window.EJS_biosUrl = "bios/gba_bios.bin";
      } else if (system === "nds") {
        window.EJS_bios7Url = "bios/bios7.bin";
        window.EJS_bios9Url = "bios/bios9.bin";
        window.EJS_firmwareUrl = "bios/firmware.bin";
      } else {
        window.EJS_biosUrl = undefined;
      }

      const old = document.getElementById("ejs-loader");
      if (old) old.remove();

      const script = document.createElement("script");
      script.id = "ejs-loader";
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(script);
    }
  </script>

</body>

</html>
